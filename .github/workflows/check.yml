name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements-lock.txt
      - run: python -m pytest test_core.py test_regressions.py -q
        working-directory: source
